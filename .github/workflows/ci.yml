name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install statslibx with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[statsmodels,sklearn,polars] pytest

      - name: Run tests
        run: pytest -v

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install statslibx with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[statsmodels,sklearn,polars,viewx] jupyter nbconvert
      - name: Execute the API notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute how_use_statslibx.ipynb --output /tmp/executed.ipynb
