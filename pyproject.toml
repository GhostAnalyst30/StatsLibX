[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statslibx"
version = "0.4.0"
description = "Statistical library for descriptive, inferential, and computational analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Ascendra" }]
keywords = ["statistics", "data-science", "pandas", "polars", "eda", "imputation", "time-series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "sympy>=1.9",
]

[project.optional-dependencies]
viewx = ["viewx>=0.3.0"]
statsmodels = ["statsmodels>=0.13"]
sklearn = ["scikit-learn>=1.0"]
excel = ["openpyxl>=3.0"]
polars = ["polars>=0.20"]
plots = ["seaborn>=0.11", "plotly>=5.0"]
all = [
    "viewx>=0.3.0",
    "statsmodels>=0.13",
    "scikit-learn>=1.0",
    "openpyxl>=3.0",
    "polars>=0.20",
    "seaborn>=0.11",
    "plotly>=5.0",
]

[project.scripts]
statslibx = "statslibx.cli:main"

[project.urls]
Homepage = "https://statslibx.vercel.app/"
Documentation = "https://github.com/GhostAnalyst30/StatsLibX"

[tool.setuptools.packages.find]
where = ["."]
include = ["statslibx*"]

[tool.setuptools.package-data]
statslibx = ["py.typed", "datasets/iris.csv", "datasets/penguins.csv", "datasets/titanic.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "viewx: tests that require viewx installed",
]
